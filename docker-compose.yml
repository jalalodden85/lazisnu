services:
  # -------------------------------------------------------------
  # Service 1: Laravel application with PHP's built-in development server
  # -------------------------------------------------------------
  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: lazisnu_app
    restart: unless-stopped
    working_dir: /var/www/html
    ports:
      - "${APP_PORT:-8080}:8000"
    volumes:
      # Project files tetap berada di luar container (host).
      # Update tinggal lakukan 'git pull' di host tanpa perlu build ulang image.
      - .:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    environment:
      - APP_ENV=${APP_ENV:-local}
      - APP_DEBUG=${APP_DEBUG:-true}
      - DB_CONNECTION=mysql
      - DB_HOST=${DB_HOST:-host.docker.internal}
      - DB_PORT=${DB_PORT:-3306}
      - DB_DATABASE=${DB_DATABASE:-lazisnu}
      - DB_USERNAME=${DB_USERNAME:-AmirSulaiman@2022}
      - DB_PASSWORD=${DB_PASSWORD:-AmirSulaiman@2022}
    networks:
      - lazisnu_network

# -------------------------------------------------------------
# Networks
# -------------------------------------------------------------
networks:
  lazisnu_network:
    name: lazisnu_network
    driver: bridge
